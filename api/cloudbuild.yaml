# Usar en Google Cloud Console → Cloud Build → Ejecutar build (subir carpeta api/ como ZIP)
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_AR_HOSTNAME/$_PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:latest
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_AR_HOSTNAME/$_PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:latest
images:
  - $_AR_HOSTNAME/$_PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:latest
substitutions:
  _AR_HOSTNAME: us-central1-docker.pkg.dev
  _REPO_NAME: freshcheck
  _SERVICE_NAME: freshcheck-api
